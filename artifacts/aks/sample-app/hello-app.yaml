# =============================================================================
# apex-localops — sample workload for AKS on bare metal (preview).
#
# A minimal nginx Deployment exposed via a NodePort Service. Mirrors the Microsoft
# Learn sample (aks-bare-metal-deploy-application) and follows the single-node
# preview best practices:
#   * NodePort (LoadBalancer is NOT supported in the preview).
#   * Image pulled from Microsoft Container Registry (mcr.microsoft.com) — the only
#     registry guaranteed reachable from the device.
#   * Explicit resource requests/limits so the workload cannot starve the
#     single-node control plane (reserve ~2 GB RAM + 1 CPU core for it).
#
# Apply with scripts/deploy-aks-sample-app.sh (it starts the Arc proxy first), or:
#   kubectl apply -f hello-app.yaml
# Then browse to  http://<bare-metal-host-ip>:<nodeport>
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-app
  labels:
    app: hello-app
data:
  # The azurelinux nginx base image ships no default site, so / would return 404 without this.
  index.html: |
    <!doctype html>
    <html>
      <head><title>apex-localops</title></head>
      <body style="font-family: system-ui, sans-serif; margin: 3rem">
        <h1>hello-app is running</h1>
        <p>Served by nginx on AKS enabled by Azure Arc, on an Azure Local cluster.</p>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-app
  labels:
    app: hello-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-app
  template:
    metadata:
      labels:
        app: hello-app
    spec:
      containers:
        - name: hello-app
          # azurelinux replaced cbl-mariner in MCR; a maintained minor tag avoids a rotting patch pin.
          image: mcr.microsoft.com/azurelinux/base/nginx:1.28
          ports:
            - containerPort: 80
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: content
          configMap:
            name: hello-app
---
apiVersion: v1
kind: Service
metadata:
  name: hello-app
  labels:
    app: hello-app
spec:
  type: NodePort
  selector:
    app: hello-app
  ports:
    - port: 80
      targetPort: 80
